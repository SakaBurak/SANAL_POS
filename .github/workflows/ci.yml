name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    # payos-db entegrasyon testleri (#[sqlx::test]) her test için bu sunucuda
    # ayrı bir veritabanı açar.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: payos
          POSTGRES_PASSWORD: payos
          POSTGRES_DB: payos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payos -d payos"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://payos:payos@localhost:5432/payos

    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml içindeki sürümü ve bileşenleri kurar
      - name: Install toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
